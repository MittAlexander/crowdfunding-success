# Default experiment configuration. Run with:
#   python -m src.pipeline --config configs/default.yaml
seed: 42
n_jobs: -1  # parallel CV folds for the scikit-learn models

data:
  path: data/raw/ks-projects-201801.csv
  start_date: "2017-01-01"  # same period as the legacy analysis; null = all years
  end_date: null
  keep_states: [successful, failed]  # live/canceled/suspended/undefined are dropped

split:
  # Chronological: oldest 70% train, next 10% calibration, newest 20% test.
  test_size: 0.2
  calibration_size: 0.1

cv:
  strategy: time  # time = TimeSeriesSplit on the training set, stratified = shuffled k-fold
  n_splits: 4
  scoring: roc_auc

calibration:
  method: isotonic  # or sigmoid (Platt scaling)

# Plain parameter names refer to the estimator; names with "__" address another
# pipeline step. Lists are searched; `n_iter` switches from grid to random search.
models:
  dummy:
    enabled: true
  logistic_regression:
    enabled: true
    params:
      C: [0.01, 0.1, 1.0, 10.0]
  decision_tree:
    enabled: true
    params:
      max_depth: [4, 6, 8, 10, 12]
      min_samples_leaf: [1, 20, 100]
  naive_bayes:
    enabled: true
    params:
      alpha: [0.1, 1.0]
      preprocess__num__n_bins: [5, 10, 20]
  knn:
    enabled: false  # slow on ~100k rows; enable to compare with the legacy results
    params:
      n_neighbors: [25, 75, 151]
  lightgbm:
    enabled: true
    n_iter: 12
    params:
      n_estimators: [300, 600]
      learning_rate: [0.03, 0.1]
      num_leaves: [15, 31, 63]
      min_child_samples: [20, 100]
      cat_smooth: [10, 50]
  catboost:
    enabled: true
    n_iter: 8
    params:
      iterations: [500, 1000]
      learning_rate: [0.03, 0.1]
      depth: [4, 6, 8]
      l2_leaf_reg: [1, 3, 10]

explain:
  models: [catboost, lightgbm]
  sample_size: 2000  # test rows used for SHAP

output:
  dir: outputs
